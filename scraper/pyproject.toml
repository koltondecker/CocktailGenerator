[project]
name = "cocktail-scraper"
version = "0.1.0"
description = "Ingest cocktail recipes from public sources into Supabase."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "selectolax>=0.3.25",
    "rapidfuzz>=3.10",
    "pydantic>=2.9",
    "python-slugify>=8.0",
    "supabase>=2.9",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "typer>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cocktail_scraper"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
