name: db-push

# Manual-run workflow. Applies everything under `supabase/migrations/` to the
# linked Supabase project using the Supabase CLI. Requires two repo secrets:
#
#   SUPABASE_ACCESS_TOKEN  — personal access token from
#                            https://supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   — the database password for the project (set when
#                            the project was created; reset at
#                            Dashboard → Project Settings → Database)
#
# Trigger via Actions → db-push → "Run workflow".

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref (the subdomain in your project URL)"
        required: true
        default: "nagjlrvlbzolghztacrp"

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Guard against missing secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is empty. Create one at https://supabase.com/dashboard/account/tokens and add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is empty. This is the database password set when the project was created; reset it at Dashboard → Project Settings → Database if you don't remember it."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "${{ inputs.project_ref }}"

      - name: Push migrations
        run: supabase db push
